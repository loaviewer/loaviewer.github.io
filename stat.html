<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리다이렉트 · 로아뷰</title>
  <script>
    // 옛 주소 호환: stat.html?name=xxx → character.html?name=xxx&tab=stat
    (function () {
      var sp = new URLSearchParams(location.search);
      sp.set("tab", "stat");
      location.replace("character.html" + (sp.toString() ? "?" + sp.toString() : "?tab=stat"));
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:40px;text-align:center;color:#888;">이동 중…</p>
</body>
