<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var sp = new URLSearchParams(location.search);
      var n = sp.get("name");
      var tab = sp.get("tab") || "info";
      var labels = { info: "정보", stat: "스텟", skill: "스킬", arkgrid: "아크그리드", arkpassive: "아크패시브", expedition: "원정대" };
      var lb = labels[tab] || "정보";
      document.title = n ? (n + " · " + lb + " · 로아뷰") : ("캐릭터 " + lb + " · 로아뷰");
      // SPA: page-shell 이 data-page=info 로 시작해도 URL tab 을 쓰도록 미리 힌트
      window.__PAGE = (tab && labels[tab]) ? tab : "info";
    })();
  </script>
  <link rel="icon" type="image/png" href="https://loaviewer.github.io/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/common.js"></script>
  <!-- GoatCounter: js/common.js 에서 처리 (/character · /gakgak-tier + 닉네임 이벤트) -->
</head>
<body class="lvs-topad-page">
  <div class="lvs-top">
    <div id="common-shell"></div>
    <div class="lvs-gptslot">
      <div id="div-gpt-ad-1793672601358-0" class="lvs-gptslot-ad"></div>
    </div>
  </div>
  <!-- data-page 는 info 고정. 실제 탭은 URL ?tab= 과 page-tabs SPA 가 담당 -->
  <script src="jas/page-shell.js" data-page="info"></script>
</body>
</html>
